name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Compile helper
        run: python -m py_compile plugins/buzz-comms/scripts/project-buzz
      - name: Run tests
        run: python -m unittest discover -s plugins/buzz-comms/tests
